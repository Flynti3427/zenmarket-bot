# Lance un tour de recherche toutes les 15 minutes sur les serveurs de GitHub (gratuit, dépôt public).
# La mémoire du bot (annonces déjà vues) est gardée d'un tour à l'autre dans le cache GitHub.
#
# Relance en chaîne : à la fin de chaque tour, le bot attend que 15 min se soient écoulées depuis
# son début, puis lance lui-même le tour suivant. La planification « schedule » reste en secours
# (GitHub la déclenche parfois très en retard, ou pas du tout sur un dépôt neuf).
name: Bot ZenMarket

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub peut décaler de quelques minutes aux heures chargées
  workflow_dispatch:          # bouton « Run workflow » pour lancer un tour à la main

concurrency:
  group: bot-zenmarket
  cancel-in-progress: false   # jamais deux tours en même temps

permissions:
  contents: write             # pour le commit anti-mise-en-veille
  actions: write              # pour que le bot relance lui-même le tour suivant

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Noter l'heure de début
        run: echo "DEBUT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer la mémoire du bot
        uses: actions/cache/restore@v4
        with:
          path: data
          key: memoire-${{ github.run_id }}
          restore-keys: memoire-

      - name: Un tour de recherche
        timeout-minutes: 20
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.main --once

      - name: Sauvegarder la mémoire du bot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: memoire-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub met en pause les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      # Un petit commit tous les 40 jours l'en empêche.
      - name: Garder le bot actif
        run: |
          dernier=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - dernier )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "zenmarket-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "Maintien du bot actif"
            git push
          fi

      # Relance en chaîne : un seul tour en attente à la fois (si la planification GitHub ou un
      # lancement manuel a déjà mis un tour en file, on ne relance pas, pour ne jamais doubler).
      - name: Programmer le tour suivant (dans 15 min)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attente=$(( 900 - ( $(date +%s) - DEBUT ) ))
          if [ "$attente" -gt 0 ]; then echo "Pause de ${attente}s avant le tour suivant"; sleep "$attente"; fi
          deja=0
          for statut in queued pending waiting requested; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/runs?status=${statut}&per_page=1" -q '.total_count' || echo 0)
            deja=$(( deja + n ))
          done
          if [ "$deja" -gt 0 ]; then
            echo "Un tour est déjà en file d'attente : pas de relance."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/dispatches" -f ref=main
            echo "Tour suivant lancé."
          fi
