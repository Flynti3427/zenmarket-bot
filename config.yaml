# =====================================================================
#  CONFIGURATION DU BOT ZENMARKET
#  Prix repris du tableau « Tableau prix sacs de luxe - Accompagnement élèves ».
#
#  RÈGLE D'ALERTE : le bot t'alerte quand le COÛT RENDU EN FRANCE
#  (prix + ZenMarket + port + douane + TVA) est <= au prix d'achat du tableau
#  (haut de la fourchette). En dessous du bas de la fourchette : alerte « 🔥 SOUS ta fourchette ».
#
#  États : tres_bon = 8/10 du tableau, moyen = 5/10 du tableau.
#  [bas, haut] = fourchette ; un seul nombre = prix fixe ; null = pas de prix.
#  Sans prix d'achat : pas d'alerte, l'article apparaît seulement dans le récap du matin.
#  Si « tres_bon » est vide, le bot reprend le prix « moyen ».
#  SEUIL UNIQUE (ton choix) : avec seuil_unique_tous_etats: true, chaque article alerte
#  sous le haut de sa fourchette 8/10 (ou son prix unique), quel que soit l'état,
#  mauvais état compris. Ex. Speedy : alerte sous 450 € même pour un 5/10 ou un sac abîmé.
#  Mets false pour revenir aux limites par état. « achat_tous_etats: <prix> » sur un
#  article force un autre seuil pour cet article.
# =====================================================================

reglages:
  intervalle_minutes: 15          # un tour complet toutes les 15 min (reste dans le gratuit Google Cloud)
  pause_entre_requetes_s: [1, 3]  # pause aléatoire entre deux requêtes (anti-blocage)
  alerte_si_baisse_prix_pct: 10   # re-alerte si un article déjà signalé baisse de 10 %
  seuil_unique_tous_etats: true   # un seul seuil par article, quel que soit l'état
  meilleure_affaire_economie_pct: 25  # salon « meilleures-affaires » : coût livré au moins 25 % sous ton prix max
  max_alertes_par_cycle: 15
  max_alertes_sans_limite_par_cycle: 20   # wallets « toutes annonces » : 20 max par tour
  fils_discord:                  # fils (sous-salons) Discord : « salon/fil »: identifiant du fil
    louis-vuitton/keepall: "1566579925719326910"
    wallet/lots: "1566764513687244800"       # évite de spammer au premier démarrage
  recap_quotidien_heure: 9        # heure (Europe/Paris) du récap Telegram
  sources: [mercari, yahoo]       # Mercari Japon + Yahoo Enchères (JDirectItems)
  langue_zenmarket: fr            # liens zenmarket.jp/fr/...

frais:
  taux_jpy_eur_secours: 0.0057    # utilisé si le taux du jour (BCE) est indisponible
  frais_service_zenmarket_jpy: 800  # Mercari et enchères : 800 ¥ / article
  frais_depot_pct: 1.5            # frais d'alimentation du solde (carte/PayPal)
  tva_pct: 20
  seuil_droits_douane_eur: 150    # au-dessus : droits de douane + frais de dossier
  frais_dossier_transporteur_eur: 15
  droit_forfaitaire_ue_eur: 3     # colis <= 150 €

# Port EMS estimé et droits de douane par type d'article (à ajuster après ton 1er colis)
profils:
  sac:      { port_eur: 40, droits_pct: 3 }    # sac ~1,5-2 kg emballé
  petit:    { port_eur: 18, droits_pct: 3 }    # portefeuille, pochette, WOC (~0,5 kg)
  vetement: { port_eur: 40, droits_pct: 12 }   # trench
  lot:      { port_eur: 30, droits_pct: 3 }    # lot de portefeuilles (~1 kg)

# Mots qui excluent une annonce (accessoires vendus seuls, contrefaçons...)
exclusions_globales:
  - 箱のみ      # boîte seule
  - 保存袋のみ  # dustbag seul
  - 袋のみ
  - 空箱
  - ショッパー  # sac papier de boutique
  - 紙袋
  - カデナのみ  # cadenas seul
  - 鍵のみ
  - チャーム
  - キーホルダー
  - ストラップのみ
  - インナーバッグ
  - バッグインバッグ
  - リメイク
  - パーツ
  - ノベルティ
  - カタログ
  - レプリカ
  - コピー
  - 偽物
